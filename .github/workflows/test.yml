name: test

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m softstrip.test_softstrip
      - run: softstrip encode LICENSE -o license
      - run: softstrip decode license.png -d out
      - run: cmp LICENSE out/LICENSE
        shell: bash
