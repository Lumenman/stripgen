[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stripgen"
version = "0.1.0"
description = "Cauzin Softstrip encoder and decoder"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.20", "pillow>=10.1"]

[project.urls]
Homepage = "https://github.com/Lumenman/stripgen"

[project.scripts]
softstrip = "softstrip.__main__:main"

[tool.setuptools]
packages = ["softstrip"]
